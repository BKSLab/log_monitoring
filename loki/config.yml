auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2023-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d
  # Защита от спама логами: макс 16 МБ/с на ingestion, burst до 32 МБ
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Не более 10 000 активных стримов (уникальных комбинаций меток)
  max_global_streams_per_user: 10000
  # Лимит строк в одном запросе из Grafana
  max_entries_limit_per_query: 10000
  # Максимальный диапазон запроса — 30 дней (соответствует retention)
  max_query_length: 720h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
